server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Foto bisa sampai 10 MB.
    client_max_body_size 12m;

    # SPA: semua rute non-file diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API ke BE (same-origin, tanpa CORS).
    location /api/ {
        proxy_pass http://be:8080;
        proxy_set_header Host $host;
        # Hormati X-Real-IP dari proxy di depan (nginx host) bila ada; kalau
        # kosong (akses langsung ke container) header dikirim kosong dan BE
        # jatuh ke X-Forwarded-For / remote address. Tanpa ini, dua lapis proxy
        # membuat BE melihat IP gateway Docker, bukan IP klien.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Cache aset statis ber-hash dari Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
