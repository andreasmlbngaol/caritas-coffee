spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5544/kopi_db}
    username: ${DB_USER:kopi}
    password: ${DB_PASSWORD:kopi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    # Kirim field null eksplisit (jangan di-omit): kontrak FE menandai field
    # opsional sebagai `X | null`, jadi JSON harus benar-benar berisi null,
    # bukan sekadar menghilangkan key (yang di JS terbaca `undefined`).
    default-property-inclusion: always

server:
  # Port internal container (nginx & compose target ke 8080). Port host diatur
  # lewat BE_PORT di .env (mapping "BE_PORT:8080"), bukan di sini.
  port: ${BE_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    ttl-seconds: ${JWT_TTL_SECONDS:604800}
    cookie-name: kopi_session
    cookie-secure: ${COOKIE_SECURE:false}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin12345}
  storage:
    path: ${STORAGE_PATH:./data/uploads}
  app-url: ${APP_URL:http://localhost:8088}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5178}
  seed-wilayah: ${SEED_WILAYAH:true}

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger-ui.html
