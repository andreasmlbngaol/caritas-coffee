services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bind ke localhost (BIND_HOST) - DB tidak boleh terbuka ke internet.
    # Di prod nginx host mem-proxy ke FE; DB/BE cukup diakses dari jaringan compose.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5544}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kopi]

  be:
    build:
      context: ./be
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/uploads}
      APP_URL: ${APP_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:${STORAGE_PATH:-/app/data/uploads}
    # BE hanya diakses nginx host (lewat jaringan compose) atau localhost.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BE_PORT:-8089}:8080"
    networks: [kopi]

  fe:
    build:
      context: ./fe
    restart: unless-stopped
    depends_on: [be]
    # nginx host mem-proxy ke sini; bind localhost agar tidak terbuka langsung.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FE_PORT:-8088}:80"
    networks: [kopi]

volumes:
  pgdata:
  uploads:

networks:
  kopi:
